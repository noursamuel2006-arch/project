<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        :root{
            --hoverColor:#FEF3E2;
            --mainColor:#D4621A ;
            --secondColor:#2A1A0E;
        }
        header{
            background-image: url(./imgs/p1.jpg);
            height: 100vh;
            width: 100%;
            background-size: cover;
            background-position: center;
        }
        header .layout{
            width: 100%;
            height: 100%;
            background-color:rgba(239, 184, 102, 0.144);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-size: 30px;
        }
        header .layout h1{
            font-size: 1.7em;
            color: var(--mainColor);
            margin-bottom: 40px;
            text-align: center;
        }
        header .layout button{
            padding: 15px 20px;
            font-size: 0.6em;
            font-weight: bold;
            border-radius: 15px;
            border: none;
            color: var(--secondColor);
            transition: all 2s ease;
            background-color: var(--hoverColor);
        }
        header .layout button:hover{
            background-color: var(--secondColor);
            color: var(--hoverColor);
            scale: 1.1;
        }
        @media screen and (max-width:500px){
        header .layout{
            font-size: 20px;
        }
        }
    </style>
</head>
<body>
    <header>
        <div class="layout">
            <h1>Lorem ipsum dolor sit amet.</h1>
            <button>Show More</button>
        </div>
    </header>
    
</body>
</html>
